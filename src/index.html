<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK Art Competition</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Конкурс VK Art</h1>
      <p class="subtitle">Примите участие в конкурсе и выиграйте призы!</p>
    </header>

    <main class="main">
      <section class="intro">
        <h2>О конкурсе</h2>
        <p>Это удивительный конкурс для талантливых художников. Присылайте свои работы и получайте шанс выиграть ценные призы!</p>
      </section>

      <section class="forms-section">
        <div class="form-container">
          <h3>Форма регистрации</h3>
          <form id="registration-form" class="form" novalidate>
            <div class="form-group">
              <label for="name">Имя:</label>
              <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Введите ваше имя"
                required
                minlength="2"
                maxlength="50"
              >
              <span class="error-message" id="name-error"></span>
            </div>
            <div class="form-group">
              <label for="phone">Телефон:</label>
              <input 
                type="tel" 
                id="phone" 
                name="phone" 
                placeholder="+7 (987) 654-32-10"
                required
              >
              <span class="error-message" id="phone-error"></span>
            </div>
            <div class="form-group">
              <label for="work-file">Загрузить работу (PNG, не более 20МБ):</label>
              <input 
                type="file" 
                id="work-file" 
                name="work-file" 
                accept="image/png"
                required
              >
              <span class="file-info" id="file-info"></span>
              <span class="error-message" id="file-error"></span>
            </div>
            <button type="submit" class="btn">Зарегистрироваться</button>
            <div class="form-notification" id="registration-notification"></div>
          </form>
        </div>

      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2024 VK Art Competition. Все права защищены.</p>
    </footer>
  </div>
</body>
</html>
